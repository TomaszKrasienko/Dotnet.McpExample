version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dotnet-mcp-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dotnet_mcp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dotnet-mcp-network

  supplier-api-1:
    build:
      context: ./src
      dockerfile: Dotnet.McpExample.SupplierApi.1/Dockerfile
    container_name: supplier-api-1
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dotnet-mcp-network

  supplier-api-2:
    build:
      context: ./src
      dockerfile: Dotnet.McpExample.SupplierApi.2/Dockerfile
    container_name: supplier-api-2
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dotnet-mcp-network

volumes:
  postgres_data:
    driver: local

networks:
  dotnet-mcp-network:
    driver: bridge
